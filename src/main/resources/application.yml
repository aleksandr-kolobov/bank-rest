server:
  port: 8080

spring:
  profiles:
    active: dev
  application:
    name: bankcardscopy
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DATASOURCE_HOST:localhost}:5432/bankcardscopy_db
    username: postgres
    password: 1234
    hikari:
      schema: bankcards_sch
      connection-init-sql: CREATE SCHEMA IF NOT EXISTS bankcards_sch
      maximum-pool-size: 10
      connection-timeout: 10000
  jpa:
    show-sql: true
    properties:
      hibernate:
        default_schema: bankcards_sch
        dialect: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
  security:
    jwt:
      secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      expiration: 86400000
      refresh-expiration: 604800000

app:
  jwt:
    secretKey: 1BCD38C6C64704B7996E7471DBA317AFC22E37D32BCD3FB8A7FCA3F
    accessTokenExpiration: 5m
    refreshTokenExpiration: 30m

logging:
  level:
    com.bank: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
    org.liquibase: INFO

card:
  encryption:
    key: ${CARD_ENCRYPTION_KEY:MySecretKey12345}
