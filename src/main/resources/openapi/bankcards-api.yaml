openapi: 3.0.0
info:
  title: API Сервиса управления картами
  version: 1.0.0
  description: API для CRUD операций с картами и переводов

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    CardStatus:
      type: string
      enum:
        - ACTIVE
        - BLOCKED
        - EXPIRED

    RoleType:
      type: string
      enum:
        - ROLE_USER
        - ROLE_ADMIN

    CardDTO:
      type: object
      properties:
        id:
          type: string
          format: uuid
        maskedCardNumber:
          type: string
          pattern: '^\*\*\*\* \*\*\*\* \*\*\*\* \d{4}$'
          example: "**** **** **** 1234"
        cardholderName:
          type: string
          example: "John Doe"
        expiryDate:
          type: string
          format: date
          example: "2025-12-31"
        status:
          $ref: '#/components/schemas/CardStatus'
        balance:
          type: number
          format: double
          example: 1000.00
        userId:
          type: string
          format: uuid

    CreateCardRequest:
      type: object
      required:
        - cardholderName
        - expiryDate
        - initialBalance
        - userId
      properties:
        cardholderName:
          type: string
          minLength: 2
          maxLength: 100
        expiryDate:
          type: string
          format: date
        initialBalance:
          type: number
          format: double
          minimum: 0
        userId:
          type: string
          format: uuid

    UpdateCardStatusRequest:
      type: object
      required:
        - status
      properties:
        status:
          $ref: '#/components/schemas/CardStatus'

    TransferRequest:
      type: object
      required:
        - fromCardId
        - toCardId
        - amount
      properties:
        fromCardId:
          type: string
          format: uuid
        toCardId:
          type: string
          format: uuid
        amount:
          type: number
          format: double
          minimum: 0.01
        description:
          type: string
          maxLength: 200

    TransactionDTO:
      type: object
      properties:
        id:
          type: string
          format: uuid
        fromCardId:
          type: string
          format: uuid
        fromCardMask:
          type: string
        toCardId:
          type: string
          format: uuid
        toCardMask:
          type: string
        amount:
          type: number
          format: double
        transactionDate:
          type: string
          format: date
        description:
          type: string

    CardFilterRequest:
      type: object
      properties:
        maskedCardNumber:
          type: string
        status:
          $ref: '#/components/schemas/CardStatus'
        minBalance:
          type: number
          format: double
        maxBalance:
          type: number
          format: double

    UserDTO:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        firstname:
          type: string
        lastname:
          type: string
        middlename:
          type: string
        enabled:
          type: boolean
        roles:
          type: array
          items:
            $ref: '#/components/schemas/RoleType'

    ErrorResponse:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
        error:
          type: string
        message:
          type: string
        path:
          type: string

security:
  - bearerAuth: []

paths:
  /api/v1/cards:
    post:
      summary: Create a new card
      tags: [Card Management]
      operationId: createCard
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCardRequest'
      responses:
        '201':
          description: Card created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardDTO'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden

  /api/v1/cards/my-cards:
    get:
      summary: Get user's own cards
      tags: [Card Management]
      operationId: getMyCards
      security:
        - bearerAuth: []
      parameters:
        - name: maskedCardNumber
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/CardStatus'
        - name: minBalance
          in: query
          required: false
          schema:
            type: number
            format: double
        - name: maxBalance
          in: query
          required: false
          schema:
            type: number
            format: double
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 0
            minimum: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            default: 10
            minimum: 1
            maximum: 100
        - name: sort
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  content:
                    type: array
                    items:
                      $ref: '#/components/schemas/CardDTO'
                  totalElements:
                    type: integer
                  totalPages:
                    type: integer
                  size:
                    type: integer
                  number:
                    type: integer
                  sort:
                    type: object
                  first:
                    type: boolean
                  last:
                    type: boolean
                  empty:
                    type: boolean
        '401':
          description: Unauthorized

  /api/v1/cards/all:
    get:
      summary: Get all cards (Admin only)
      tags: [Card Management]
      operationId: getAllCards
      security:
        - bearerAuth: []
      parameters:
        - name: maskedCardNumber
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/CardStatus'
        - name: minBalance
          in: query
          required: false
          schema:
            type: number
            format: double
        - name: maxBalance
          in: query
          required: false
          schema:
            type: number
            format: double
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  content:
                    type: array
                    items:
                      $ref: '#/components/schemas/CardDTO'
                  totalElements:
                    type: integer
                  totalPages:
                    type: integer
        '401':
          description: Unauthorized
        '403':
          description: Forbidden

  /api/v1/cards/{cardId}:
    get:
      summary: Get card by ID
      tags: [Card Management]
      operationId: getCardById
      security:
        - bearerAuth: []
      parameters:
        - name: cardId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardDTO'
        '404':
          description: Card not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    patch:
      summary: Update card status
      tags: [Card Management]
      operationId: updateCardStatus
      security:
        - bearerAuth: []
      parameters:
        - name: cardId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCardStatusRequest'
      responses:
        '200':
          description: Status updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardDTO'
        '400':
          description: Invalid status
        '404':
          description: Card not found

    delete:
      summary: Delete card (Admin only)
      tags: [Card Management]
      operationId: deleteCard
      security:
        - bearerAuth: []
      parameters:
        - name: cardId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Card deleted successfully
        '404':
          description: Card not found
        '403':
          description: Forbidden

  /api/v1/transfers/own-cards:
    post:
      summary: Transfer between own cards
      tags: [Transfer Management]
      operationId: transferBetweenOwnCards
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferRequest'
      responses:
        '200':
          description: Transfer successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionDTO'
        '400':
          description: Invalid transfer request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - cards not owned by user

  /api/v1/transfers/my-transactions:
    get:
      summary: Get user's transaction history
      tags: [Transfer Management]
      operationId: getMyTransactions
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  content:
                    type: array
                    items:
                      $ref: '#/components/schemas/TransactionDTO'
                  totalElements:
                    type: integer
                  totalPages:
                    type: integer

  /api/v1/transfers/card/{cardId}/transactions:
    get:
      summary: Get transactions for a specific card
      tags: [Transfer Management]
      operationId: getCardTransactions
      security:
        - bearerAuth: []
      parameters:
        - name: cardId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Successful response
        '403':
          description: Access denied
        '404':
          description: Card not found

  /api/v1/admin/users:
    get:
      summary: Get all users (Admin only)
      tags: [Admin User Management]
      operationId: getAllUsers
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  content:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserDTO'
                  totalElements:
                    type: integer
                  totalPages:
                    type: integer
        '403':
          description: Forbidden

  /api/v1/admin/users/{userId}:
    get:
      summary: Get user by ID
      tags: [Admin User Management]
      operationId: getUserById
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDTO'
        '404':
          description: User not found

    put:
      summary: Update user
      tags: [Admin User Management]
      operationId: updateUser
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                role:
                  type: string
                  enum: [ROLE_USER, ROLE_ADMIN]
                enabled:
                  type: boolean
      responses:
        '200':
          description: User updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDTO'

    delete:
      summary: Delete user
      tags: [Admin User Management]
      operationId: deleteUser
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: User deleted successfully
        '404':
          description: User not found
